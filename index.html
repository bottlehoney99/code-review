<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>파이썬 실험실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style id="css">
/* 모눈종이 위 교사의 빨간 펜: 왼쪽 문제 목록, 오른쪽 문제·편집기·채점 결과 */
:root {
  --paper: #eef2f1;
  --surface: #ffffff;
  --code-bg: #fbfcfc;
  --ink: #1c2631;
  --muted: #5a6875;
  --line: #d3dbde;
  --grid: rgba(28, 38, 49, 0.045);
  --btn: #1f3a52;
  --btn-ink: #ffffff;
  --pen: #cf2f27;
  --ok: #1d7448;
  --ok-bg: #e5f2ea;
  --bad: #ad2a22;
  --bad-bg: #f8e7e5;
  --warn: #8a5a00;
  --warn-bg: #f7eedb;
  --hint-bg: #fff8e6;
  --font-ui: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-code: "JetBrains Mono", "D2Coding", "IBM Plex Sans KR", "Malgun Gothic", monospace;
  --font-pen: "Nanum Pen Script", "IBM Plex Sans KR", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171c; --surface: #1a2128; --code-bg: #0f1418; --ink: #e4e9ed; --muted: #95a3af;
    --line: #2b353f; --grid: rgba(228, 233, 237, 0.035); --btn: #d9e4ec; --btn-ink: #12171c;
    --pen: #ff6d60; --ok: #63c991; --ok-bg: #173126; --bad: #ff8278; --bad-bg: #3a1d1b;
    --warn: #e8b85c; --warn-bg: #33291a; --hint-bg: #2a2619; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12171c; --surface: #1a2128; --code-bg: #0f1418; --ink: #e4e9ed; --muted: #95a3af;
  --line: #2b353f; --grid: rgba(228, 233, 237, 0.035); --btn: #d9e4ec; --btn-ink: #12171c;
  --pen: #ff6d60; --ok: #63c991; --ok-bg: #173126; --bad: #ff8278; --bad-bg: #3a1d1b;
  --warn: #e8b85c; --warn-bg: #33291a; --hint-bg: #2a2619; color-scheme: dark;
}
html { font-size: 15px; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-ui);
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 0 48px;
}
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

.top {
  max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 18px 14px; border-bottom: 2px solid var(--ink);
}
.brand { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.01em; margin-right: auto; }
.brand small { font-weight: 400; color: var(--muted); font-size: 0.85rem; margin-left: 8px; }
.modes { display: flex; border: 1px solid var(--ink); }
.modes button { background: transparent; border: 0; padding: 6px 14px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; padding-top: 22px; }
aside h3 { font-size: 0.75rem; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plist button {
  width: 100%; text-align: left; background: transparent; border: 0; border-left: 3px solid transparent;
  padding: 8px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; line-height: 1.35;
}
.plist button:hover { background: var(--surface); }
.plist button[aria-current="true"] { border-left-color: var(--pen); background: var(--surface); font-weight: 500; }
.plist .num { font-family: var(--font-code); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.plist .grp { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.06em; color: var(--muted); padding: 16px 10px 4px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
.plist .grp:first-child { padding-top: 0; }
.plist .done { margin-left: auto; color: var(--pen); font-family: var(--font-pen); font-size: 1.15rem; line-height: 1; }
.addbtn { margin-top: 10px; width: 100%; }

/* 난이도: 막대 다섯 칸 중 채운 칸 수 */
:root { --lv1: #2f7d4f; --lv2: #2a7187; --lv3: #3d5a80; --lv4: #b06a00; --lv5: #c0352b; }
:root[data-theme="dark"] { --lv1: #6fcf97; --lv2: #6cc3d8; --lv3: #9db7dd; --lv4: #f0b45a; --lv5: #ff7a6e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lv1: #6fcf97; --lv2: #6cc3d8; --lv3: #9db7dd; --lv4: #f0b45a; --lv5: #ff7a6e; } }
.lv { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; flex: 0 0 auto; }
.lv i { width: 3px; background: var(--line); display: block; }
.lv i:nth-child(1) { height: 4px; } .lv i:nth-child(2) { height: 5.5px; } .lv i:nth-child(3) { height: 7px; } .lv i:nth-child(4) { height: 9px; } .lv i:nth-child(5) { height: 11px; }
.lv[data-l="1"] i.on { background: var(--lv1); } .lv[data-l="2"] i.on { background: var(--lv2); } .lv[data-l="3"] i.on { background: var(--lv3); }
.lv[data-l="4"] i.on { background: var(--lv4); } .lv[data-l="5"] i.on { background: var(--lv5); }
.plist .lv { margin-left: auto; align-self: center; }
.plist .done + .lv, .plist .lv + .done { margin-left: 6px; }
.plist .ttl { min-width: 0; }
.lvtag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 500; padding: 1px 8px; border: 1px solid currentColor; }
.lvtag[data-l="1"] { color: var(--lv1); } .lvtag[data-l="2"] { color: var(--lv2); } .lvtag[data-l="3"] { color: var(--lv3); } .lvtag[data-l="4"] { color: var(--lv4); } .lvtag[data-l="5"] { color: var(--lv5); }
.lvtag .lv i.on { background: currentColor !important; }
.lvfilter { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 14px; }
.lvfilter button { background: transparent; border: 1px solid var(--line); padding: 2px 8px; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.lvfilter button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface); font-weight: 500; }
.lvfilter .cnt { font-variant-numeric: tabular-nums; font-size: 0.72rem; }
.lvnote { font-size: 0.78rem; color: var(--muted); margin: -6px 0 12px; line-height: 1.45; }

main { min-width: 0; }
.ptitle { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 6px; }
.ptitle h2 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; text-wrap: balance; }
.tag { font-size: 0.78rem; border: 1px solid var(--line); background: var(--surface); padding: 1px 8px; color: var(--muted); }
.tag code { font-family: var(--font-code); color: var(--ink); }
.desc { max-width: 68ch; white-space: pre-wrap; margin: 10px 0 18px; }
.desc .cblk { font-family: var(--font-code); font-size: 0.92em; color: var(--ink, inherit); }
.desc code, .note code { font-family: var(--font-code); font-size: 0.9em; background: var(--surface); border: 1px solid var(--line); padding: 0 4px; }

.examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 22px; }
.ex { background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.ex .exh { font-size: 0.75rem; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); letter-spacing: 0.04em; }
.ex .exb { display: grid; grid-template-columns: 1fr 1fr; }
.ex .exb > div { padding: 8px 10px; min-width: 0; }
.ex .exb > div + div { border-left: 1px dashed var(--line); }
.lbl { font-size: 0.72rem; color: var(--muted); display: block; margin-bottom: 2px; }
pre.v { margin: 0; font-family: var(--font-code); font-size: 0.86rem; white-space: pre-wrap; word-break: break-all; }

.editor { display: grid; grid-template-columns: auto minmax(0, 1fr); border: 1px solid var(--ink); background: var(--code-bg); }
.gutter {
  font-family: var(--font-code); font-size: 0.9rem; line-height: 1.55; color: var(--muted); text-align: right;
  padding: 12px 8px 12px 12px; border-right: 1px solid var(--line); user-select: none; overflow: hidden; white-space: pre; font-variant-numeric: tabular-nums;
}
.editor textarea {
  font-family: var(--font-code); font-size: 0.9rem; line-height: 1.55; border: 0; resize: vertical; background: transparent;
  padding: 12px; min-height: 260px; width: 100%; tab-size: 4; white-space: pre; overflow: auto; outline: none;
}
.editor:focus-within { outline: 2px solid var(--pen); outline-offset: 1px; }
.edhelp { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 0; }
.btn { border: 1px solid var(--ink); background: var(--surface); padding: 8px 16px; cursor: pointer; }
.btn:hover { background: var(--paper); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.12); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: 0.5; cursor: progress; }
.btn.small { padding: 4px 10px; font-size: 0.85rem; }
.status { color: var(--muted); font-size: 0.9rem; }

.runbox { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.runbox textarea, .field textarea, .field input, .field select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); padding: 8px 10px;
}
.runbox textarea, textarea.mono { font-family: var(--font-code); font-size: 0.86rem; }
.runout { background: var(--surface); border: 1px solid var(--line); padding: 8px 10px; min-height: 84px; min-width: 0; }

.score { display: flex; align-items: center; gap: 18px; margin: 28px 0 12px; flex-wrap: wrap; }
.score .big { font-family: var(--font-pen); color: var(--pen); font-size: 3rem; line-height: 1; position: relative; padding: 4px 18px; }
.score .big svg { position: absolute; inset: -6px -4px; width: calc(100% + 8px); height: calc(100% + 12px); overflow: visible; }
.score .msg { font-size: 1rem; }
.cases { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.case { border-bottom: 1px solid var(--line); }
.case-row { display: grid; grid-template-columns: 34px 88px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 4px; }
.case-row .cname { font-variant-numeric: tabular-nums; }
.case-row .cname small { display: block; color: var(--muted); font-size: 0.72rem; line-height: 1.2; }
.pill { font-size: 0.8rem; padding: 1px 8px; font-weight: 500; justify-self: start; }
.pill.pass { background: var(--ok-bg); color: var(--ok); }
.pill.wrong, .pill.err { background: var(--bad-bg); color: var(--bad); }
.pill.tle { background: var(--warn-bg); color: var(--warn); }
.cdetail { padding: 0 4px 12px 48px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.cdetail > div { min-width: 0; }
.cdetail .errmsg { grid-column: 1 / -1; font-family: var(--font-code); font-size: 0.84rem; color: var(--bad); white-space: pre-wrap; }
mark.diff { background: var(--bad-bg); color: var(--bad); }
.mark svg { display: block; width: 28px; height: 28px; }
.mark .stroke { fill: none; stroke: var(--pen); stroke-width: 2.6; stroke-linecap: round; }

.hint { margin-top: 18px; background: var(--hint-bg); border-left: 3px solid var(--pen); padding: 12px 14px; max-width: 72ch; white-space: pre-wrap; }
.hint .lbl { margin-bottom: 6px; }

.banner { max-width: 1180px; margin: 14px auto 0; padding: 10px 14px; background: var(--bad-bg); color: var(--bad); }
.sample-tag { font-size: 0.72rem; color: var(--muted); border: 1px dashed var(--line); padding: 0 6px; }

/* 문제 관리 */
.form { display: grid; gap: 16px; max-width: 900px; }
.field label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 4px; }
.field .sub { font-weight: 400; color: var(--muted); font-size: 0.78rem; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; }
.tests-wrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table.tests { border-collapse: collapse; width: 100%; min-width: 620px; }
table.tests th { text-align: left; font-size: 0.75rem; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.tests td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.tests td textarea { width: 100%; min-height: 54px; border: 1px solid var(--line); background: var(--code-bg); padding: 4px 6px; font-family: var(--font-code); font-size: 0.84rem; resize: vertical; }
table.tests td.n { font-variant-numeric: tabular-nums; color: var(--muted); width: 32px; }
.savebar {
  position: sticky; bottom: 0; background: var(--surface); border-top: 2px solid var(--ink); padding: 10px 14px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px;
}
.note { font-size: 0.82rem; color: var(--muted); max-width: 72ch; }

@media (max-width: 760px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  aside { overflow-x: auto; }
  .plist { flex-direction: row; gap: 4px; }
  .plist li { flex: 0 0 auto; }
  .plist button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; }
  .plist button[aria-current="true"] { border-bottom-color: var(--pen); }
  .plist .grp, .plist .grp:first-child { padding: 8px 6px 0 14px; border-bottom: 0; margin: 0; white-space: nowrap; align-self: center; }
  .plist .lv { margin-left: 6px; }
  .case-row { grid-template-columns: 30px 70px minmax(0, 1fr); }
  .case-row .tog { grid-column: 3; justify-self: start; }
  .cdetail { padding-left: 4px; }
}
@media (prefers-reduced-motion: no-preference) {
  .score .big svg path { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 0.6s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
}

/* 학생 코드 */
.who { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.who b { font-family: var(--font-code); color: var(--ink); font-weight: 600; letter-spacing: 0.08em; }
.who button { background: transparent; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 0.8rem; }
.gate { max-width: 420px; margin: 64px auto 0; background: var(--surface); border: 1px solid var(--ink); padding: 26px 26px 22px; position: relative; }
.gate::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pen); }
.gate h2 { margin: 0 0 6px; font-size: 1.3rem; letter-spacing: -0.01em; }
.gate p { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; word-break: keep-all; }
.gate form { display: flex; gap: 8px; }
.gate input { flex: 1; min-width: 0; font-family: var(--font-code); font-size: 1.35rem; letter-spacing: 0.3em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--ink); background: var(--code-bg); }
.gate .gmsg { min-height: 1.4em; margin: 10px 0 0; font-size: 0.85rem; color: var(--bad); }
.gate .skip { margin-top: 6px; font-size: 0.8rem; }
.gate .mono-code { font-family: var(--font-code); letter-spacing: 0.08em; color: var(--pen); }
.gate .actions { margin-top: 0; }
.loading { max-width: 1180px; margin: 28px auto 0; }
.rec { font-size: 0.8rem; color: var(--muted); margin: 6px 0 0; }
.rec.bad { color: var(--bad); }

/* 내 기록 */
.views { display: flex; border: 1px solid var(--ink); }
.views button { background: transparent; border: 0; padding: 6px 14px; cursor: pointer; }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.ranklink { font-size: 0.85rem; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--pen); padding-bottom: 1px; }
.ranklink:hover { color: var(--pen); }
.me { max-width: 1180px; margin: 0 auto; padding-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 34px; }
.me > div { min-width: 0; }
.me .alias { font-size: 0.85rem; color: var(--muted); margin: 0 0 4px; }
.me .alias b { color: var(--ink); font-weight: 500; }
.me .count { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; }
.me .count .n { font-size: 4.2rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.me .count .of { color: var(--muted); font-size: 1.1rem; }
.me .count .pen { font-family: var(--font-pen); color: var(--pen); font-size: 1.7rem; margin-left: 6px; transform: rotate(-4deg); display: inline-block; }
.me .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 22px; }
.me h3 { font-size: 0.75rem; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; margin: 0 0 10px; }
.lvrows { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; margin-bottom: 26px; font-size: 0.9rem; }
.lvrows .track { height: 10px; background: var(--surface); border: 1px solid var(--line); position: relative; }
.lvrows .track i { position: absolute; left: 0; top: 0; bottom: 0; }
.lvrows .num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; }
.stamps { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.stamp { width: 84px; height: 84px; border: 2px solid var(--line); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 0.72rem; line-height: 1.25; padding: 6px; }
.stamp b { font-size: 1.15rem; font-weight: 700; }
.stamp.on { border-color: var(--pen); color: var(--pen); transform: rotate(-6deg); }
.stamp.on:nth-child(even) { transform: rotate(5deg); }
.stamp.on b { font-family: var(--font-pen); font-size: 1.6rem; font-weight: 400; line-height: 1; }
.mlist { list-style: none; margin: 0 0 26px; padding: 0; background: var(--surface); border: 1px solid var(--line); }
.mlist li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mlist li:last-child { border-bottom: 0; }
.mlist .pn { font-family: var(--font-code); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mlist .pt { font-weight: 500; }
.mlist .info { color: var(--muted); font-size: 0.82rem; }
.mlist .go { margin-left: auto; }
.mlist .got { color: var(--bad); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.solved { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 26px; padding: 0; list-style: none; }
.solved button { background: var(--surface); border: 1px solid var(--line); padding: 3px 9px; cursor: pointer; font-size: 0.85rem; display: inline-flex; gap: 6px; align-items: baseline; }
.solved button:hover { border-color: var(--ink); }
.solved .pn { font-family: var(--font-code); font-size: 0.75rem; color: var(--muted); }
.solhint { font-size: 0.78rem; color: var(--muted); margin: -4px 0 8px; }
.solved button[aria-expanded="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.solved button[aria-expanded="true"] .pn { color: inherit; }
.solpanel { margin: -12px 0 26px; background: var(--surface); border: 1px solid var(--ink); border-left: 4px solid var(--ok); padding: 12px 14px; }
.solhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.solhead .pn { font-family: var(--font-code); font-size: 0.8rem; color: var(--muted); }
.solwhen { margin-left: auto; font-size: 0.8rem; color: var(--ok); }
.solcode { margin: 10px 0 0; background: var(--code-bg); border: 1px solid var(--line); padding: 10px 12px; font-family: var(--font-code); font-size: 0.85rem; white-space: pre; overflow: auto; max-height: 360px; }
.solpanel .actions { margin-top: 10px; }
@media (max-width: 860px) { .me { grid-template-columns: 1fr; gap: 10px; } }

.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 0.8rem; margin-left: 6px; }
.aliasform { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 10px; }
.aliasform input { padding: 4px 8px; border: 1px solid var(--ink); background: var(--code-bg); width: 12em; }
.aliasform .ahint { flex-basis: 100%; margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); }
.aliasform .ahint b { color: var(--ink); font-weight: 500; }
.aliasform .amsg { flex-basis: 100%; margin: 0; font-size: 0.82rem; color: var(--bad); min-height: 1.2em; }

.tlink { font-size: 0.85rem; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--pen); padding-bottom: 1px; }
.savebar .btn + .btn { margin-left: 0; }
.savebar .src { flex-basis: 100%; margin: 0; font-size: 0.8rem; color: var(--muted); }

/* 이달의 MVP 띠: 학생 화면 맨 위에 고정 */
.mvp { position: sticky; top: 0; z-index: 15; margin: 0 -16px; padding: 7px 16px; background: var(--ink); color: var(--paper); }
.mvp .in { max-width: 1180px; margin: 0 auto; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 0.95rem; }
.mvp .mvp-tag { position: relative; font-weight: 700; letter-spacing: 0.02em; padding: 0 4px; }
.mvp .mvp-tag svg { position: absolute; left: -9px; top: -7px; width: calc(100% + 18px); height: calc(100% + 14px); overflow: visible; pointer-events: none; }
.mvp .mvp-tag svg path { fill: none; stroke: #ff6d60; stroke-width: 2.2; stroke-linecap: round; }
.mvp .mvp-who { font-family: var(--font-pen); font-size: 1.7rem; line-height: 1; color: #ffd36e; }
.mvp .mvp-cnt { font-size: 0.85rem; opacity: 0.8; font-variant-numeric: tabular-nums; }
.mvp .mvp-hint { margin-left: auto; font-size: 0.8rem; opacity: 0.7; }
.mvp a { color: inherit; }
@media (max-width: 560px) { .mvp .mvp-hint { display: none; } }

/* 주제별 접기 + 목록만 따로 스크롤 */
aside { position: sticky; top: 52px; align-self: start; max-height: calc(100vh - 64px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.ahead { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; }
.ahead h3 { margin: 0 !important; }
.ahead .allbtn { margin-left: auto; background: none; border: 0; padding: 0; color: var(--muted); font-size: 0.75rem; text-decoration: underline; cursor: pointer; }
.plist .grp { padding: 10px 0 0 !important; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
.plist .grp:first-child { padding-top: 0 !important; }
.plist .grp .gbtn { width: 100%; display: flex; align-items: baseline; gap: 6px; background: none; border: 0; border-left: 0; padding: 6px 10px 5px 4px; cursor: pointer; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); text-align: left; }
.plist .grp .gbtn:hover { color: var(--ink); background: transparent; }
.plist .grp .caret { display: inline-block; width: 1em; text-align: center; font-size: 1.05rem; line-height: 1; transition: transform .15s; }
.plist .grp .gbtn[aria-expanded="true"] .caret { transform: rotate(90deg); }
.plist .grp .gbtn[aria-expanded="true"] { color: var(--ink); }
.plist .grp .gcnt { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 0.74rem; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.plist .grp .gcnt.full { color: var(--pen); font-family: var(--font-pen); font-size: 1rem; }
@media (max-width: 760px) {
  aside { position: static; max-height: none; overflow-y: visible; overflow-x: auto; padding-right: 0; }
  .plist .grp, .plist .grp:first-child { padding: 0 !important; border-bottom: 0; align-self: center; }
  .plist .grp .gbtn { white-space: nowrap; border: 1px solid var(--line); padding: 3px 8px; }
}

  function gradeCase(p, code, t) {
    var studentLines = code.split("\n").length;

        if (ev.err) return { status: "err", err: "기대값을 읽지 못했습니다. 선생님께 알려 주세요. (" + ev.err + ")" };
        return runPy(prog, "", LIMIT_MS).then(function (r) {
          if (!r.ok) return failFromErr(r, studentLines);
          var got = r.mod.$d.__r;

    return runPy(code, t.input, LIMIT_MS).then(function (r) {

  }

  function lineDiff(exp, act, ignoreWs) {

  function firstFail(run) { for (var i = 0; i < run.cases.length; i++) if (run.cases[i].status !== "pass") return i; return -1; }

  // ---------- 코드 편집기 ----------
  function makeEditor(text, onChange) {
    var el = h('<div class="editor"><div class="gutter" aria-hidden="true"></div><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="파이썬 코드" id="code-' + (ui.current || "x") + '"></textarea></div>');
    var ta = el.querySelector("textarea"), gut = el.querySelector(".gutter");
    var escPressed = false;
    ta.value = text;
    function nums() {
      var n = ta.value.split("\n").length, s = "";
      for (var i = 1; i <= n; i++) s += i + "\n";
      gut.textContent = s; gut.scrollTop = ta.scrollTop;
    }
    function edit(start, end, ins, caretS, caretE) {
      ta.setRangeText(ins, start, end, "end");
      if (caretS != null) ta.setSelectionRange(caretS, caretE == null ? caretS : caretE);
      changed();
    }
    function changed() { nums(); onChange(ta.value); }
    ta.addEventListener("input", changed);
    ta.addEventListener("scroll", function () { gut.scrollTop = ta.scrollTop; });
    ta.addEventListener("keydown", function (e) {
      var v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
      if (e.key === "Escape") { escPressed = true; return; }
      if (e.key === "Tab") {
        if (escPressed) { escPressed = false; return; }
        e.preventDefault();
        var ls = v.lastIndexOf("\n", s - 1) + 1;
        if (e.shiftKey) {
          var le = v.indexOf("\n", en); if (le < 0) le = v.length;
          var block = v.slice(ls, le), removed = 0, first = 0;
          var nb = block.split("\n").map(function (l, k) { var m = /^ {1,4}/.exec(l); var r = m ? m[0].length : 0; if (k === 0) first = r; removed += r; return l.slice(r); }).join("\n");
          edit(ls, le, nb, Math.max(ls, s - first), Math.max(ls, en - removed));
        } else if (s !== en && v.slice(s, en).indexOf("\n") >= 0) {
          var le2 = v.indexOf("\n", en - 1); if (le2 < 0) le2 = v.length;
          var blk = v.slice(ls, le2).split("\n"), nb2 = blk.map(function (l) { return "    " + l; }).join("\n");
          edit(ls, le2, nb2, s + 4, en + 4 * blk.length);
        } else {
          edit(s, en, "    ");
        }
        return;
      }
      escPressed = false;
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        var ls2 = v.lastIndexOf("\n", s - 1) + 1;
        var line = v.slice(ls2, s);
        var ind = /^[ \t]*/.exec(line)[0];
        if (/:\s*(#.*)?$/.test(line)) ind += "    ";
        edit(s, en, "\n" + ind);
      }
    });
    nums();
    return { el: el, value: function () { return ta.value; }, set: function (t) { ta.value = t; nums(); } };
  }

        var t = p.tests[i];
        st.textContent = "케이스 " + (i + 1) + " 실행 중…";
        var prog = isFn ? code + "\n\n__rr = repr(" + p.funcName + "(" + t.input + "))\n" : code;
        runPy(prog, isFn ? "" : t.input, 4000).then(function (r) {
          if (!r.ok) errs.push((i + 1) + "번(" + r.err.split(":")[0] + ")");
          else t.expected = isFn ? pyVal(r.mod, "__rr") : normOut(r.out, false);
          i++; setTimeout(next, 0);
        });
      })();
    });
    form.appendChild(fr);

    var del = h('<div class="actions"><button type="button" class="btn small danger" id="delp">이 문제 삭제</button></div>');
    del.querySelector("#delp").addEventListener("click", function (e) {
      var b = e.currentTarget;
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "한 번 더 누르면 삭제됩니다"; return; }
      state.problems = state.problems.filter(function (x) { return x.id !== p.id; });
      ui.current = state.problems[0] ? state.problems[0].id : null; mark(); render();
    });
    form.appendChild(del);

    main.appendChild(form);
    main.appendChild(saveBar());
  }

  // 고칠 때마다 번호를 올린다. 저장 응답이 왔을 때 번호가 그대로일 때만 '저장됨'으로 바꾼다.
  function markDirty() { ui.dirty = true; ui.editSeq++; var s = document.getElementById("savestate"); if (s) s.textContent = "저장하지 않은 변경 사항이 있습니다."; }
  function saveBar() {
    if (ui.artifact) return artifactSaveBar();
    var bar = h('<div class="savebar"><button type="button" class="btn primary" id="save">저장해서 학생 화면에 반영</button>' +
      '<button type="button" class="btn small" id="backup">JSON 백업 복사</button><span class="status" id="savestate"></span></div>');
    var st = bar.querySelector("#savestate");
    st.textContent = ui.dirty ? "저장하지 않은 변경 사항이 있습니다." : "고친 뒤 저장을 눌러야 학생들에게 반영됩니다.";
    bar.appendChild(h('<p class="src">' + (ui.pSource === "server" ? "지금 보이는 문제는 서버에 저장된 버전 " + ui.pVersion + "입니다." :
      "아직 서버에 저장한 적이 없어 저장소의 problems.json을 불러왔습니다. 처음 저장하면 이 문제 " + state.problems.length + "개가 모두 서버로 옮겨집니다.") +
      ' 학생 화면에 이미 열려 있는 페이지는 새로고침해야 바뀐 문제가 보입니다. 숨김 케이스는 학생 화면에 나오지 않지만, 개발자 도구로 찾아볼 수는 있습니다.</p>'));
    bar.querySelector("#save").addEventListener("click", function (e) {
      var btn = e.currentTarget;
      btn.disabled = true; st.textContent = "저장 중…";
      var seq = ui.editSeq;
      var list = state.problems.map(function (p) { var c = JSON.parse(JSON.stringify(p)); delete c.sample; return c; });
      rpc("teacher_save_problems", { p_key: ui.tkey, p_problems: list, p_version: ui.pVersion }).then(function (r) {
        btn.disabled = false;
        if (r && r.ok) {
          ui.pVersion = r.version; ui.pSource = "server"; expectedCache = {};
          var stAll = document.getElementById("savestate") || st;
          if (ui.editSeq === seq) { ui.dirty = false; stAll.textContent = "저장했습니다 (버전 " + r.version + "). 학생들이 새로고침하면 반영됩니다."; }
          else stAll.textContent = "버전 " + r.version + "으로 저장했지만, 저장하는 동안 고친 내용은 아직 저장되지 않았습니다. 한 번 더 저장하세요.";
          var s2 = document.querySelector(".savebar .src"); if (s2) s2.textContent = "지금 보이는 문제는 서버에 저장된 버전 " + r.version + "입니다. 학생 화면에 이미 열려 있는 페이지는 새로고침해야 바뀐 문제가 보입니다.";
          return;
        }
        var why = r && r.reason;
        if (why === "conflict") st.textContent = "다른 창에서 먼저 저장해서 이번 변경은 저장하지 않았습니다. 'JSON 백업 복사'로 지금 내용을 챙긴 뒤 새로고침하세요.";
        else if (why === "too_big") st.textContent = "문제 내용이 너무 커서 저장하지 못했습니다.";
        else st.textContent = "문제 형식에 문제가 있어 저장하지 못했습니다. 문제 번호(id)가 겹치는지 확인하세요.";
      }).catch(function (err) {
        btn.disabled = false;
        if (err && /bad key/.test(err.message || "")) {
          ui.tkey = null; try { sessionStorage.removeItem("tkey"); } catch (x) {}
          st.textContent = "교사 비밀번호가 맞지 않습니다. 'JSON 백업 복사'로 내용을 챙긴 뒤 새로고침해서 다시 들어오세요.";
          return;
        }
        st.textContent = "서버에 연결하지 못했습니다. 잠시 뒤 다시 누르세요.";
      });
    });
    bar.querySelector("#backup").addEventListener("click", function () {
      var text = JSON.stringify({ problems: state.problems }, null, 2) + "\n";
      var fallback = function () {
        var ta = document.createElement("textarea"); ta.value = text; ta.className = "mono"; ta.rows = 8; ta.style.width = "100%"; ta.readOnly = true;
        bar.appendChild(ta); ta.focus(); ta.select();
        st.textContent = "자동 복사가 막혀 있습니다. 아래 칸의 내용을 Ctrl+C로 복사하세요.";
      };
      try { navigator.clipboard.writeText(text).then(function () { st.textContent = "전체 문제를 JSON으로 복사했습니다."; }, fallback); } catch (er) { fallback(); }
    });
    return bar;
  }

  function artifactSaveBar() {
    var bar = h('<div class="savebar"><button type="button" class="btn primary" id="save">변경 사항 저장</button><span class="status" id="savestate">' +
      (ui.dirty ? "저장하지 않은 변경 사항이 있습니다." : "저장하면 학생들이 보는 페이지에 바로 반영됩니다.") + '</span></div>');
    bar.querySelector("#save").addEventListener("click", function (e) {
      var btn = e.currentTarget, st = bar.querySelector("#savestate");
      btn.disabled = true; st.textContent = "저장 중…";
      state.problems.forEach(function (p) { delete p.sample; });
      var seq = ui.editSeq;
      ui.artifact.publish(buildDoc()).then(function () {
        if (ui.editSeq === seq) ui.dirty = false;
        st.textContent = ui.editSeq === seq ? "저장했습니다. 페이지가 새 버전으로 다시 열립니다." : "저장했지만, 저장하는 동안 고친 내용은 빠졌습니다. 한 번 더 저장하세요.";
      }).catch(function (err) {
        btn.disabled = false;
        var c = err && err.code;
        if (c === "conflict") st.textContent = "다른 곳에서 먼저 저장해서 이번 변경은 반영되지 않았습니다. 페이지가 최신 버전으로 다시 열립니다.";
        else if (c === "not_writer" || c === "not_granted") st.textContent = "이 계정은 읽기 전용이라 저장할 수 없습니다.";
        else if (c === "rate_limited") st.textContent = "저장 요청이 너무 잦습니다. 잠시 뒤 다시 누르세요.";
        else st.textContent = "저장하지 못했습니다 (" + (c || "알 수 없는 오류") + ").";
      });
    });
    return bar;
  }

  function buildDoc() {
    var json = JSON.stringify({ problems: state.problems }).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
      RESET + '</style></head><body>' +
      '<title>파이썬 실험실</title>\n' + FONT_LINK + '\n<style id="css">' + CSS_TEXT + '</style>\n<div id="app"></div>\n' +
      '<script type="application/json" id="state">' + json + '</' + 'script>\n' + SK_TAGS + '\n' +
      '<script id="appjs">' + SELF_JS + '</' + 'script>\n</body></html>';
  }

  window.addEventListener("beforeunload", function (e) { if (ui.dirty && ui.mode === "teacher") { e.preventDefault(); e.returnValue = ""; } });

  if (location.hash === "#edit") { ui.canEdit = true; ui.mode = "teacher"; }
  window.addEventListener("hashchange", function () { if (location.hash === "#edit") { ui.canEdit = true; ui.mode = "teacher"; render(); } });
  render();
  if (ui.code && !ui.confirmCode) { touchSeen(); loadProgress(); }
  flushPending(); // 큐에는 학생 코드가 함께 들어 있어서, 누가 앉아 있든 원래 학생 앞으로 간다
  loadMvp();
  setInterval(function () { if (!document.hidden && ui.mode === "student") loadMvp(); }, 60000);
  function useProblems(list, source, version) {
    if (ui.dirty) return;
    var same = ui.loaded && JSON.stringify(list) === JSON.stringify(state.problems);
    state = { problems: list }; ui.pSource = source; ui.pVersion = version; ui.loaded = true;
    if (!cur()) { var last = store("lastpid"); ui.current = state.problems.some(function (p) { return p.id === last; }) ? last : (state.problems[0] ? state.problems[0].id : null); }
    if (!same) render(); // 같은 문제면 다시 그리지 않아서, 치던 코드의 커서가 빠지지 않는다
  }
  function loadFile() {
    return fetch("problems.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      if (d && Array.isArray(d.problems)) useProblems(d.problems, "file", 0); else throw 0;
    }).catch(function () { if (!ui.loaded) { ui.loadErr = true; render(); } });
  }
  rpc("get_problems", {}).then(function (d) {
    if (d && Array.isArray(d.problems)) useProblems(d.problems, "server", d.version);
    else loadFile();
  }).catch(loadFile);

  // ---------- 런타임 기능 (있으면 켜기) ----------
  var C = window.claude;
  if (C && typeof C.use === "function") {
    C.use("user").then(function (u) {
      if (!u) return;
      return u.canEdit().then(function (can) { if (can) { ui.canEdit = true; render(); } });
    }).catch(function () {});
    C.use("artifact").then(function (a) { ui.artifact = a; }).catch(function () {});
    C.use("sample").then(function (s) { if (s) { ui.sample = s; render(); } }).catch(function () {});
  }
})();
</script>
</body>
</html>
