        gradeCase(p, code, p.tests[i]).then(function (r) { res.push(r); i++; setTimeout(next, 0); });
      })();
    });
  }

  function lineDiff(exp, act, ignoreWs) {
    if (ignoreWs) return esc(act);
    var e = normOut(exp).split("\n"), a = String(act || "").replace(/\r/g, "").replace(/\n+$/, "").split("\n");
    return a.map(function (l, i) { return (l.replace(/[ \t]+$/, "") !== (e[i] == null ? null : e[i])) ? '<mark class="diff">' + esc(l || " ") + '</mark>' : esc(l); }).join("\n");
  }

  function drawResults(area, p, run) {
    var n = run.cases.length, pass = run.cases.filter(function (r) { return r.status === "pass"; }).length;
    var all = pass === n;
    var msg = all ? "모든 케이스를 통과했습니다." : (pass === 0 ? "통과한 케이스가 없습니다. 아래에서 틀린 이유를 확인하세요." : (n - pass) + "개 케이스에서 틀렸습니다.");
    var score = h('<div class="score"><span class="big">' + pass + ' / ' + n + (all ? '<svg viewBox="0 0 120 70" preserveAspectRatio="none" aria-hidden="true"><path class="stroke" style="fill:none;stroke:var(--pen);stroke-width:2.4;stroke-linecap:round" d="M62 4C96 3 117 16 116 34c-1 20-27 32-58 31C26 64 4 52 4 34 4 17 24 6 50 5"/></svg>' : '') + '</span><span class="msg">' + msg + '</span></div>');
    area.appendChild(score);
    if (ui.code) { var rl = h('<p class="rec" id="recline"></p>'); rl.dataset.pid = p.id; area.appendChild(rl); setTimeout(function () { showRec(p, run); }, 0); }

    var ul = h('<ul class="cases"></ul>');
    var visIdx = 0, hidIdx = 0;
    run.cases.forEach(function (r, i) {
      var t = p.tests[i];
      var name = t.hidden ? "숨김 " + (++hidIdx) : "예제 " + (++visIdx);
      var label = { pass: "통과", wrong: "틀림", err: "오류", tle: "시간 초과" }[r.status];
      var mark = r.status === "pass" ? MARK_PASS : (r.status === "tle" ? MARK_TLE : MARK_FAIL);
      var li = h('<li class="case"><div class="case-row"><span class="mark">' + mark + '</span>' +
        '<span class="cname">' + name + '</span><span class="pill ' + r.status + '">' + label + '</span></div></li>');
      var row = li.querySelector(".case-row");
      if (r.status !== "pass") {
        var det = document.createElement("div"); det.className = "cdetail"; det.hidden = !(i === firstFail(run));
        var parts = "";
        if (!t.hidden) {
          var inShown = p.kind === "function" ? p.funcName + "(" + t.input + ")" : t.input;
          parts += '<div><span class="lbl">' + (p.kind === "function" ? "호출" : "입력") + '</span><pre class="v">' + esc(inShown) + '</pre></div>';
          parts += '<div><span class="lbl">기대한 값</span><pre class="v">' + esc(t.expected) + '</pre></div>';
          if (r.status === "wrong") parts += '<div><span class="lbl">내 코드의 ' + (p.kind === "function" ? "반환값" : "출력") + '</span><pre class="v">' +
            (p.kind === "function" ? esc(r.actual) : (r.actual ? lineDiff(t.expected, r.actual, p.ignoreWs) : '(아무것도 출력하지 않음)')) + '</pre></div>';
        } else if (r.status === "wrong") {
          parts += '<div class="note">공개되지 않은 입력이라 값은 보여 주지 않습니다. 경계값(0, 1, 아주 큰 수, 음수 등)을 넣어 직접 실행해 보세요.</div>';
        }
        if (r.err) parts += '<div class="errmsg">' + esc(r.err) + '</div>';
        det.innerHTML = parts;
        var tog = h('<button type="button" class="btn small tog">' + (det.hidden ? "자세히" : "접기") + '</button>');
        tog.setAttribute("aria-expanded", String(!det.hidden));
        tog.addEventListener("click", function () { det.hidden = !det.hidden; tog.textContent = det.hidden ? "자세히" : "접기"; tog.setAttribute("aria-expanded", String(!det.hidden)); });
        row.appendChild(tog);
        li.appendChild(det);
      }
      ul.appendChild(li);
    });
    area.appendChild(ul);

    if (!all && ui.sample) {
      var hb = h('<div class="actions"><button type="button" class="btn" id="hintbtn">AI에게 힌트 받기</button><span class="status">정답 코드는 알려 주지 않고 어디를 볼지만 짚어 줍니다.</span></div>');
      area.appendChild(hb);
      var box = h('<div class="hint" hidden><span class="lbl">AI 힌트</span><div class="hbody"></div></div>');
      area.appendChild(box);
      if (run.hint) { box.hidden = false; box.querySelector(".hbody").textContent = run.hint; }
      hb.querySelector("#hintbtn").addEventListener("click", function (e) { askHint(p, run, box, e.currentTarget); });
    }
  }
  function firstFail(run) { for (var i = 0; i < run.cases.length; i++) if (run.cases[i].status !== "pass") return i; return -1; }

  function askHint(p, run, box, btn) {
    var body = box.querySelector(".hbody");
    box.hidden = false; body.textContent = "생각하는 중…"; btn.disabled = true;
    var lines = [];
    run.cases.forEach(function (r, i) {
      var t = p.tests[i];
      if (r.status === "pass") return;
      if (t.hidden) {
        lines.push("- 비공개 케이스: " + ({ wrong: "결과가 다름", err: "실행 오류 " + (r.err || ""), tle: "시간 초과" }[r.status]));
      } else {
        lines.push("- 공개 케이스 입력/호출: " + (p.kind === "function" ? p.funcName + "(" + t.input + ")" : JSON.stringify(t.input)) +
          "\n  기대값: " + JSON.stringify(t.expected) +
          (r.status === "wrong" ? "\n  학생 결과: " + JSON.stringify(r.actual) : "") +
          (r.err ? "\n  오류: " + r.err : ""));
      }
    });
    var prompt = [
      "너는 고등학교 정보 수업의 파이썬 실습 도우미다. 학생이 제출한 코드가 일부 테스트를 통과하지 못했다.",
      "규칙:",
      "1. 고친 코드 전체나 정답 코드를 쓰지 않는다. 필요하면 코드 한 줄 이내의 조각만 보여 준다.",
      "2. 무엇이 왜 틀렸는지, 어느 줄이나 어떤 경우를 다시 보면 되는지 짚어 준다.",
      "3. 비공개 케이스의 입력값을 추측해서 구체적으로 알려 주지 않는다. '0이나 음수 같은 경계값을 생각해 보라' 수준까지만 말한다.",
      "4. 한국어 존댓말로, 4문장 안팎으로 짧게 쓴다. 마크다운 기호는 쓰지 않는다.",
      "",
      "[문제 제목] " + p.title,
      "[문제 형식] " + (p.kind === "function" ? "함수 " + p.funcName + " 작성 (반환값 비교)" : "표준 입력을 받아 출력 (출력 비교" + (p.ignoreWs ? ", 공백 차이 무시)" : ")")),
      "[문제 설명]", p.desc,
      "", "[학생 코드]", run.code,
      "", "[실패한 케이스]", lines.join("\n")
    ].join("\n");
    ui.sample(prompt, { onText: function (u) { body.textContent = u.text; } })
      .then(function (res) { body.textContent = res.text; run.hint = res.text; btn.disabled = false; })
      .catch(function (e) {
        btn.disabled = false;
        var code = e && e.code;
        if (code === "not_granted") { body.textContent = "AI 힌트 사용이 허용되지 않았습니다."; btn.hidden = true; }
        else if (code === "rate_limited") body.textContent = "요청이 많아 잠시 막혔습니다. 1~2분 뒤 다시 눌러 주세요.";
        else body.textContent = "힌트를 받지 못했습니다. (" + (code || "알 수 없는 오류") + ")";
      });
  }

  // ---------- 코드 편집기 ----------
  function makeEditor(text, onChange) {
    var el = h('<div class="editor"><div class="gutter" aria-hidden="true"></div><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="파이썬 코드" id="code-' + (ui.current || "x") + '"></textarea></div>');
    var ta = el.querySelector("textarea"), gut = el.querySelector(".gutter");
    var escPressed = false;
    ta.value = text;
    function nums() {
      var n = ta.value.split("\n").length, s = "";
      for (var i = 1; i <= n; i++) s += i + "\n";
      gut.textContent = s; gut.scrollTop = ta.scrollTop;
    }
    function edit(start, end, ins, caretS, caretE) {
      ta.setRangeText(ins, start, end, "end");
      if (caretS != null) ta.setSelectionRange(caretS, caretE == null ? caretS : caretE);
      changed();
    }
    function changed() { nums(); onChange(ta.value); }
    ta.addEventListener("input", changed);
    ta.addEventListener("scroll", function () { gut.scrollTop = ta.scrollTop; });
    ta.addEventListener("keydown", function (e) {
      var v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
      if (e.key === "Escape") { escPressed = true; return; }
      if (e.key === "Tab") {
        if (escPressed) { escPressed = false; return; }
        e.preventDefault();
        var ls = v.lastIndexOf("\n", s - 1) + 1;
        if (e.shiftKey) {
          var le = v.indexOf("\n", en); if (le < 0) le = v.length;
          var block = v.slice(ls, le), removed = 0, first = 0;
          var nb = block.split("\n").map(function (l, k) { var m = /^ {1,4}/.exec(l); var r = m ? m[0].length : 0; if (k === 0) first = r; removed += r; return l.slice(r); }).join("\n");
          edit(ls, le, nb, Math.max(ls, s - first), Math.max(ls, en - removed));
        } else if (s !== en && v.slice(s, en).indexOf("\n") >= 0) {
          var le2 = v.indexOf("\n", en - 1); if (le2 < 0) le2 = v.length;
          var blk = v.slice(ls, le2).split("\n"), nb2 = blk.map(function (l) { return "    " + l; }).join("\n");
          edit(ls, le2, nb2, s + 4, en + 4 * blk.length);
        } else {
          edit(s, en, "    ");
        }
        return;
      }
      escPressed = false;
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        var ls2 = v.lastIndexOf("\n", s - 1) + 1;
        var line = v.slice(ls2, s);
        var ind = /^[ \t]*/.exec(line)[0];
        if (/:\s*(#.*)?$/.test(line)) ind += "    ";
        edit(s, en, "\n" + ind);
      }
    });
    nums();
    return { el: el, value: function () { return ta.value; }, set: function (t) { ta.value = t; nums(); } };
  }

  // ---------- 문제 관리 ----------
  function renderTeacher(main) {
    var p = cur();
    if (!p) {
      main.appendChild(h('<p class="note">왼쪽에서 문제를 고르거나 새 문제를 추가하세요.</p>'));
      main.appendChild(saveBar());
      return;
    }
    var form = h('<div class="form"></div>');
    function mark() { ui.dirty = true; var s = document.getElementById("savestate"); if (s) s.textContent = "저장하지 않은 변경 사항이 있습니다."; }

    var f1 = h('<div class="row2"><div class="field"><label for="f-title">제목</label><input id="f-title"></div>' +
      '<div class="field"><label for="f-group">분류 <span class="sub">같은 분류끼리 목록에 묶입니다</span></label><input id="f-group" list="group-list">' +
      '<datalist id="group-list">' + state.problems.map(function (x) { return (x.group || "").trim(); }).filter(function (g, k, arr) { return g && arr.indexOf(g) === k; }).map(function (g) { return '<option value="' + esc(g) + '"></option>'; }).join("") + '</datalist></div>' +
      '<div class="field"><label for="f-level">난이도</label><select id="f-level">' + [1, 2, 3, 4, 5].map(function (l) { return '<option value="' + l + '">' + l + ' ' + LEVELS[l] + '</option>'; }).join("") + '</select></div>' +
      '<div class="field"><label for="f-kind">채점 방식</label><select id="f-kind"><option value="stdin">입력 → 출력 비교 (input / print)</option><option value="function">함수 반환값 비교</option></select></div></div>');
    f1.querySelector("#f-title").value = p.title;
    f1.querySelector("#f-kind").value = p.kind;
    f1.querySelector("#f-level").value = String(lvOf(p));
    f1.querySelector("#f-level").addEventListener("change", function (e) { p.level = parseInt(e.target.value, 10); mark(); render(); });
    f1.querySelector("#f-title").addEventListener("input", function (e) { p.title = e.target.value; mark(); });
    f1.querySelector("#f-group").value = p.group || "";
    f1.querySelector("#f-group").addEventListener("change", function (e) { p.group = e.target.value.trim(); mark(); render(); });
    f1.querySelector("#f-kind").addEventListener("change", function (e) { p.kind = e.target.value; mark(); render(); });
    form.appendChild(f1);

    if (p.kind === "function") {
      var ff = h('<div class="field"><label for="f-fn">함수 이름 <span class="sub">학생이 정의해야 하는 함수. 예: is_leap</span></label><input id="f-fn" class="mono" spellcheck="false"></div>');
      ff.querySelector("input").value = p.funcName || "";
      ff.querySelector("input").addEventListener("input", function (e) { p.funcName = e.target.value.trim(); mark(); });
      form.appendChild(ff);
    } else {
      var fw = h('<label class="check"><input type="checkbox" id="f-ws"> 공백·줄바꿈 차이 무시 <span class="sub" style="color:var(--muted);font-size:.8rem">(켜면 "1 2 3"과 "1\\n2\\n3"을 같게 봅니다)</span></label>');
      fw.querySelector("input").checked = !!p.ignoreWs;
      fw.querySelector("input").addEventListener("change", function (e) { p.ignoreWs = e.target.checked; mark(); });
      form.appendChild(fw);
    }

    var fd = h('<div class="field"><label for="f-desc">문제 설명 <span class="sub">`백틱`으로 감싸면 코드 글꼴로 보입니다</span></label><textarea id="f-desc" rows="6"></textarea></div>');
    fd.querySelector("textarea").value = p.desc || "";
    fd.querySelector("textarea").addEventListener("input", function (e) { p.desc = e.target.value; mark(); });
    form.appendChild(fd);

    var fs = h('<div class="field"><label for="f-starter">처음 코드 <span class="sub">학생 편집기에 미리 들어갈 코드 (비워 둬도 됨)</span></label><textarea id="f-starter" rows="3" class="mono" spellcheck="false"></textarea></div>');
    fs.querySelector("textarea").value = p.starter || "";
    fs.querySelector("textarea").addEventListener("input", function (e) { p.starter = e.target.value; mark(); });
    form.appendChild(fs);

    var isFn = p.kind === "function";
    var ft = h('<div class="field"><label>테스트 케이스 <span class="sub">' +
      (isFn ? "인자는 파이썬 식으로 적습니다. 예: <code>3, [1, 2]</code> / 돌려줄 값: <code>True</code>, <code>\"abc\"</code>, <code>[1, 2]</code>" :
        "입력은 학생 코드의 input()에 한 줄씩 들어갑니다. 출력은 줄 끝 공백과 마지막 빈 줄을 무시하고 비교합니다.") +
      '</span></label><div class="tests-wrap"><table class="tests"><thead><tr><th>#</th><th>' + (isFn ? "인자" : "입력") + '</th><th>' + (isFn ? "돌려줄 값" : "기대 출력") + '</th><th>숨김</th><th></th></tr></thead><tbody></tbody></table></div>' +
      '<div class="actions"><button type="button" class="btn small" id="addt">케이스 추가</button></div></div>');
    var tb = ft.querySelector("tbody");
    p.tests.forEach(function (t, i) {
      var tr = h('<table><tr><td class="n">' + (i + 1) + '</td><td><textarea spellcheck="false" aria-label="케이스 ' + (i + 1) + ' 입력" id="t-in-' + i + '"></textarea></td>' +
        '<td><textarea spellcheck="false" aria-label="케이스 ' + (i + 1) + ' 기대값" id="t-ex-' + i + '"></textarea></td>' +
        '<td><input type="checkbox" aria-label="케이스 ' + (i + 1) + ' 숨김" id="t-hd-' + i + '"></td><td><button type="button" class="btn small danger">삭제</button></td></tr></table>').querySelector("tr");
      var tas = tr.querySelectorAll("textarea");
      tas[0].value = t.input; tas[1].value = t.expected;
      tas[0].addEventListener("input", function (e) { t.input = e.target.value; mark(); });
      tas[1].addEventListener("input", function (e) { t.expected = e.target.value; mark(); });
      var cb = tr.querySelector("input"); cb.checked = !!t.hidden;
      cb.addEventListener("change", function (e) { t.hidden = e.target.checked; mark(); });
      tr.querySelector("button").addEventListener("click", function () { p.tests.splice(i, 1); mark(); render(); });
      tb.appendChild(tr);
    });
    ft.querySelector("#addt").addEventListener("click", function () { p.tests.push({ input: "", expected: "", hidden: true }); mark(); render(); });
    form.appendChild(ft);

    var fr = h('<div class="field"><label for="f-ref">모범 답안으로 기대값 채우기 <span class="sub">여기에 정답 코드를 넣고 실행하면 위 표의 기대값이 자동으로 채워집니다. 모범 답안은 저장되지 않습니다.</span></label>' +
      '<textarea id="f-ref" rows="6" class="mono" spellcheck="false"></textarea><div class="actions"><button type="button" class="btn small" id="fill">모범 답안 실행해서 채우기</button><span class="status" id="fillst"></span></div></div>');
    fr.querySelector("#fill").addEventListener("click", function () {
      var code = fr.querySelector("textarea").value, st = fr.querySelector("#fillst");
      if (!code.trim()) { st.textContent = "모범 답안 코드를 먼저 넣으세요."; return; }
      if (isFn && !p.funcName) { st.textContent = "함수 이름을 먼저 적으세요."; return; }
      var i = 0, errs = [];
      (function next() {
        if (i >= p.tests.length) {
          mark(); var keep = code; render();
          var ta = document.getElementById("f-ref"); if (ta) ta.value = keep;
          var s2 = document.getElementById("fillst"); if (s2) s2.textContent = errs.length ? "오류가 난 케이스: " + errs.join(", ") : p.tests.length + "개 케이스의 기대값을 채웠습니다. 확인 후 저장하세요.";
          return;
        }
        var t = p.tests[i];
        st.textContent = "케이스 " + (i + 1) + " 실행 중…";
        var prog = isFn ? code + "\n\n__rr = repr(" + p.funcName + "(" + t.input + "))\n" : code;
        runPy(prog, isFn ? "" : t.input, 4000).then(function (r) {
          if (!r.ok) errs.push((i + 1) + "번(" + r.err.split(":")[0] + ")");
          else t.expected = isFn ? pyVal(r.mod, "__rr") : normOut(r.out, false);
          i++; setTimeout(next, 0);
        });
      })();
    });
    form.appendChild(fr);

    var del = h('<div class="actions"><button type="button" class="btn small danger" id="delp">이 문제 삭제</button></div>');
    del.querySelector("#delp").addEventListener("click", function (e) {
      var b = e.currentTarget;
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "한 번 더 누르면 삭제됩니다"; return; }
      state.problems = state.problems.filter(function (x) { return x.id !== p.id; });
      ui.current = state.problems[0] ? state.problems[0].id : null; mark(); render();
    });
    form.appendChild(del);

    main.appendChild(form);
    main.appendChild(saveBar());
  }

  function saveBar() {
    var bar = h('<div class="savebar"><button type="button" class="btn primary" id="save">' + (ui.artifact ? "변경 사항 저장" : "problems.json 내용 복사") + '</button><span class="status" id="savestate">' +
      (ui.dirty ? "저장하지 않은 변경 사항이 있습니다." : (ui.artifact ? "저장하면 학생들이 보는 페이지에 바로 반영됩니다." : "여기서 고친 내용은 이 브라우저에만 남습니다. 복사해서 저장소의 problems.json에 붙여 넣어야 학생들에게 반영됩니다.")) + '</span></div>');
    bar.appendChild(h('<p class="note" style="flex-basis:100%;margin:0">숨김 케이스는 학생 화면에 표시되지 않지만, 공개 저장소의 problems.json을 열어 보면 값을 찾을 수 있습니다.</p>'));
    bar.querySelector("#save").addEventListener("click", function (e) {
      var btn = e.currentTarget, st = bar.querySelector("#savestate");
      if (!ui.artifact) {
        var text = JSON.stringify({ problems: state.problems }, null, 2) + "\n";
        var done = function () { st.textContent = "복사했습니다. GitHub 저장소의 problems.json 내용을 지우고 붙여 넣은 뒤 Commit changes를 누르세요. 1~2분 뒤 사이트에 반영됩니다."; ui.dirty = false; };
        var fallback = function () {
          var ta = document.createElement("textarea"); ta.value = text; ta.className = "mono"; ta.rows = 8; ta.style.width = "100%"; ta.readOnly = true;
          bar.appendChild(ta); ta.focus(); ta.select();
          st.textContent = "자동 복사가 막혀 있습니다. 아래 칸의 내용을 Ctrl+C로 복사하세요.";
        };
        try { navigator.clipboard.writeText(text).then(done, fallback); } catch (er) { fallback(); }
        return;
      }
      btn.disabled = true; st.textContent = "저장 중…";
      state.problems.forEach(function (p) { delete p.sample; });
      ui.artifact.publish(buildDoc()).then(function () {
        ui.dirty = false; st.textContent = "저장했습니다. 페이지가 새 버전으로 다시 열립니다.";
      }).catch(function (err) {
        btn.disabled = false;
        var c = err && err.code;
        if (c === "conflict") st.textContent = "다른 곳에서 먼저 저장해서 이번 변경은 반영되지 않았습니다. 페이지가 최신 버전으로 다시 열립니다.";
        else if (c === "not_writer" || c === "not_granted") st.textContent = "이 계정은 읽기 전용이라 저장할 수 없습니다.";
        else if (c === "rate_limited") st.textContent = "저장 요청이 너무 잦습니다. 잠시 뒤 다시 누르세요.";
        else st.textContent = "저장하지 못했습니다 (" + (c || "알 수 없는 오류") + ").";
      });
    });
    return bar;
  }

  function buildDoc() {
    var json = JSON.stringify({ problems: state.problems }).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
      RESET + '</style></head><body>' +
      '<title>파이썬 실험실</title>\n' + FONT_LINK + '\n<style id="css">' + CSS_TEXT + '</style>\n<div id="app"></div>\n' +
      '<script type="application/json" id="state">' + json + '</' + 'script>\n' + SK_TAGS + '\n' +
      '<script id="appjs">' + SELF_JS + '</' + 'script>\n</body></html>';
  }

  window.addEventListener("beforeunload", function (e) { if (ui.dirty && ui.mode === "teacher") { e.preventDefault(); e.returnValue = ""; } });

  if (location.hash === "#edit") { ui.canEdit = true; ui.mode = "teacher"; }
  window.addEventListener("hashchange", function () { if (location.hash === "#edit") { ui.canEdit = true; ui.mode = "teacher"; render(); } });
  render();
  if (ui.code) { loadProgress(); flushPending(); }
  fetch("problems.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
    if (!d || !Array.isArray(d.problems)) return;
    state = d;
    if (!cur()) ui.current = state.problems[0] ? state.problems[0].id : null;
    render();
  }).catch(function () {});

  // ---------- 런타임 기능 (있으면 켜기) ----------
  var C = window.claude;
  if (C && typeof C.use === "function") {
    C.use("user").then(function (u) {
      if (!u) return;
      return u.canEdit().then(function (can) { if (can) { ui.canEdit = true; render(); } });
    }).catch(function () {});
    C.use("artifact").then(function (a) { ui.artifact = a; }).catch(function () {});
    C.use("sample").then(function (s) { if (s) { ui.sample = s; render(); } }).catch(function () {});
  }
})();
</script>
</body>
</html>
